<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Drow (Tier'Dal) Names</title>
    <style>
        .none { display: none; }
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 2em auto;
            padding: 0 1em;
        }
        button {
            background: #6b3fa0;
            color: #ffffff;
            border: 1px solid #9060c8;
            border-radius: 4px;
            padding: 0.35em 1em;
            font-size: 0.95em;
            cursor: pointer;
            margin-left: 0.5em;
        }
        button:hover { background: #7d4fb8; }
        h1 { font-size: 1.4em; margin-bottom: 0.75em; }
        label { font-size: 0.95em; margin-right: 0.25em; }
        select {
            border-radius: 0px;
            padding: 0.3em 0.5em;
            font-size: 1em;
        }
        ol {
            margin-top: 1.25em;
            padding-left: 1.5em;
            line-height: 2;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0d0010; color: #ffffff; }
            button {
                background: #3b1a5e;
                color: #ffffff;
                border: 1px solid #7a4faa;
            }
            button:hover { background: #5a2d8a; }
        }
    </style>
</head>

<body onload="generate()">
    <h1>Drow (Tier'Dal) Names</h1>
    <label>
        Gender
        <select id="gender" onchange="generate()">
            <option value="M">Male</option>
            <option value="F">Female</option>

    </label>
    <button onclick="generate();">Generate</button>
    <ol id="name-list" class="none"></ol>

            "X`Teria", "Y`Lask", "Zexus"];

        function pick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generate() {
            const ol = document.getElementById('name-list');
            if (!ol) { return; }
            const s = document.getElementById('gender');
            if (!s) { return; }
            const firstNames = s.value === "M" ? male : female;
            ol.innerHTML = "";
            for (var i = 0; i < 10; i++) {
                const li = document.createElement("li");
                li.innerText = `${pick(firstNames)} ${pick(surnames)}`;
                ol.appendChild(li);
            }
            ol.classList = "";
        }
    </script>
</body>
</html>
