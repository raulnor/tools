<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drow (Tier'Dal) Names</title>
    <style>
        .none { display: none; }
    </style>
</head>

<body onload="generate()">
    <h1>Drow (Tier'Dal) Names</h1>
    <label>
        Gender
        <select id="gender" onchange="generate()">
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>
    </label>
    <button onclick="generate();">Generate</button>
    <ol id="name-list" class="none"></ol>

    <script>
        const male = [
            "Antian", "Belux", "Divn", "Felox", "Gath",
            "Litz", "Psal", "Niz", "Tolax", "Zartox"];
        const female = [
            "Andara", "Camia", "Dissa", "Issva", "Marza",
            "Opal", "Petra", "Rista", "Tizzy", "Vissa"];
        const surnames = [
            "B`Div", "C`Luzz", "D`Vinn", "F`Lox", "G`Noir",
            "Kix", "L`Crit", "N`Mar", "S`Lon", "V`Retta",
            "X`Ta"];

        function pick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generate() {
            const ol = document.getElementById('name-list');
            if (!ol) { return; }
            const s = document.getElementById('gender');
            if (!s) { return; }
            const firstNames = s.value === "M" ? male : female;
            ol.innerHTML = "";
            for (var i = 0; i < 10; i++) {
                const li = document.createElement("li");
                li.innerText = `${pick(firstNames)} ${pick(surnames)}`;
                ol.appendChild(li);
            }
            ol.classList = "";
        }
    </script>
</body>
</html>
